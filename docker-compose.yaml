services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    hostname: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - custom_network
    volumes:
      - data-zookeeper-log:/var/lib/zookeeper/log
      - data-zookeeper-data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_SERVER_ID: "1"
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_INIT_LIMIT: "5"
      ZOOKEEPER_SYNC_LIMIT: "2"

  kafka-1:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka-1
    hostname: kafka-1
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    networks:
      - custom_network
    volumes:
      - data-kafka-1:/var/lib/kafka/data
      - ./certs/kafka/kafka-1:/etc/kafka/secrets:ro
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,PLAINTEXT://localhost:9092,SSL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_SSL_KEYSTORE_FILENAME: kafka.kafka-1.keystore.pkcs12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka-1_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka-1_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.kafka-1.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka-1_truststore_creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    restart: always
    ports:
      - "5432:5432"
    networks:
      - custom_network
    volumes:
      - data-postgres:/var/lib/postgresql/data
      - ./postgres/custom-config.conf:/etc/postgresql/custom-config.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/custom-config.conf"]
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: postgres-user
      POSTGRES_PASSWORD: postgres-pw

  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: kafka-connect
    hostname: kafka-connect
    restart: always
    depends_on:
      - kafka-1
      - postgres
    ports:
      - "8083:8083"
      - "9876:9876"
    networks:
      - custom_network
    volumes:
      - ./confluent-hub-components:/usr/share/confluent-hub-components:ro
      - ./kafka-connect/jmx_prometheus_javaagent-0.15.0.jar:/opt/jmx_prometheus_javaagent.jar:ro
      - ./kafka-connect/kafka-connect.yml:/etc/jmx_exporter/kafka-connect.yml:ro
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:29092
      CONNECT_REST_PORT: "8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: kafka-connect-group

      CONNECT_CONFIG_STORAGE_TOPIC: kafka-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: kafka-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: kafka-connect-statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_OPTS: -javaagent:/opt/jmx_prometheus_javaagent.jar=9876:/etc/jmx_exporter/kafka-connect.yml

  debezium-ui:
    image: quay.io/debezium/debezium-ui:latest
    container_name: debezium-ui
    hostname: debezium-ui
    restart: always
    depends_on:
      - kafka-connect
    ports:
      - "8080:8080"
    networks:
      - custom_network
    environment:
      KAFKA_CONNECT_URIS: http://kafka-connect:8083

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: always
    depends_on:
      - kafka-connect
    ports:
      - "9090:9090"
    networks:
      - custom_network
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - data-prometheus:/prometheus

  grafana:
    build:
      context: ./grafana
    container_name: grafana
    hostname: grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - custom_network
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - data-grafana:/var/lib/grafana

volumes:
  data-zookeeper-log:
  data-zookeeper-data:
  data-kafka-1:
  data-postgres:
  data-prometheus:
  data-grafana:

networks:
  custom_network:
    name: custom_network